packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

# Refuse any package version published less than 14 days ago (minutes).
minimumReleaseAge: 20160

# Transitive dependencies may only come from the registry, never git URLs or tarballs.
blockExoticSubdeps: true

# Refuse a package version whose publish is less trusted than earlier versions of it.
trustPolicy: no-downgrade

# Checked 2026-10-26: types-only (41 .d.ts files, no install scripts), published 2024-11-13, required by @types/node.
trustPolicyExclude:
  - "undici-types@6.21.0"

# Only these dependencies may run install scripts.
# Skia (checked 2026-10-27): scripts/install-libs.js only copies its prebuilt binaries from its own
# react-native-skia-android / -apple-* npm packages into libs/; no network, no other writes.
onlyBuiltDependencies:
  - esbuild
  - "@shopify/react-native-skia"
